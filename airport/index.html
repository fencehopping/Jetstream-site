<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TTW0QR0CXM"></script>
    <script>
      const GA_MEASUREMENT_ID = "G-TTW0QR0CXM";
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', GA_MEASUREMENT_ID);
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opening App Store…</title>
    <meta name="robots" content="noindex,nofollow" />
    <link
      rel="canonical"
      href="https://apps.apple.com/app/apple-store/id6760587975?pt=128342316&amp;ct=AirportTV_BOS_May2026&amp;mt=8"
    />
    <meta
      http-equiv="refresh"
      content="3; url=https://apps.apple.com/app/apple-store/id6760587975?pt=128342316&amp;ct=AirportTV_BOS_May2026&amp;mt=8"
    />
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f8fb;
        color: #111827;
      }

      main {
        width: min(100% - 32px, 420px);
        text-align: center;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1rem;
        font-weight: 700;
        line-height: 1.2;
      }

      p {
        margin: 0 0 16px;
        color: #4b5563;
        line-height: 1.5;
      }

      a {
        color: #0f766e;
        font-weight: 700;
      }

      @media (prefers-color-scheme: dark) {
        body {
          background: #080b12;
          color: #f9fafb;
        }

        p {
          color: #cbd5e1;
        }

        a {
          color: #5eead4;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Opening JetStream…</h1>
      <p>If you are not redirected automatically, use the link below.</p>
      <a
        id="fallback-link"
        href="https://apps.apple.com/app/apple-store/id6760587975?pt=128342316&amp;ct=AirportTV_BOS_May2026&amp;mt=8"
        >Open Jetstream in the App Store</a
      >
    </main>

    <script>
      const APP_STORE_AIRPORT_CAMPAIGN_URL =
        "https://apps.apple.com/app/apple-store/id6760587975?pt=128342316&ct=AirportTV_BOS_May2026&mt=8";
      let hasRedirected = false;

      const redirectToAppStore = () => {
        if (hasRedirected) {
          return;
        }

        hasRedirected = true;
        window.location.replace(APP_STORE_AIRPORT_CAMPAIGN_URL);
      };

      window.setTimeout(redirectToAppStore, 2000);

      if (typeof gtag === "function") {
        gtag("event", "airport_tv_qr_scan", {
          campaign: "airport_tv",
          destination: "app_store",
          page_path: window.location.pathname,
          event_callback: redirectToAppStore,
          event_timeout: 1500
        });
      } else {
        redirectToAppStore();
      }
    </script>
  </body>
</html>
